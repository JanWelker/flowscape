<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Flowscape</title>
    <!-- Self-hosted, cookieless visit counter. The same document is the
         GitHub Pages demo and the page embedded in the binary, so the website
         is picked by hostname: the demo and the homelab deployment each count
         as their own, and anywhere else nothing is loaded at all. -->
    <script>
      (function () {
        var sites = {
          "janwelker.github.io": "83534e88-30c9-4765-b303-df4f4345002f",
          "flowscape.k8s.wlkr.ch": "9390939c-b7a6-4262-8cc7-8b3b4a6a1ecc",
        };
        var id = sites[location.hostname];
        if (!id) return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = "https://analytics.k8s.wlkr.ch/script.js";
        s.dataset.websiteId = id;
        s.dataset.domains = location.hostname;
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <aside id="filters"></aside>
    <aside id="panel" hidden></aside>
    <footer id="colophon">
      <span>Engineered in Basel. Assembled by AI.</span>
      <span>&copy; 2026 Jan Welker</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
