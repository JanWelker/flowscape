<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Flowscape</title>
    <!-- Self-hosted, cookieless visit counter for the GitHub Pages demo. The same
         document is embedded in the binary, and data-domains is what keeps a
         deployment from reporting: anywhere but the demo's hostname the browser
         fetches the script and the script sends nothing. -->
    <script
      defer
      src="https://analytics.k8s.wlkr.ch/script.js"
      data-website-id="83534e88-30c9-4765-b303-df4f4345002f"
      data-domains="janwelker.github.io"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <aside id="filters"></aside>
    <aside id="panel" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
