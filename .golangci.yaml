version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - bodyclose
    - errorlint
    - nilerr
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/JanWelker/flowscape
