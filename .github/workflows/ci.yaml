---
name: CI
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Test
        run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install
        run: npm --prefix web ci --no-audit --no-fund

      - name: Lint
        run: npm --prefix web run lint

      - name: Unit tests
        run: npm --prefix web test

      - name: Build
        run: npm --prefix web run build

      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Screenshot test
        run: npm --prefix web run e2e

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot
          path: |
            docs/screenshot.png
            web/test-results/
          if-no-files-found: ignore

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: flowscape:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same constraints as the Pod Security "restricted" profile.
      - name: Smoke test
        run: |
          docker run -d --name flowscape --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 flowscape:ci --demo
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          docker logs flowscape
          exit 1
